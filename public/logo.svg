<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A0D8E8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#52C3DD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00A9CE;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Cuadrado 1 (más claro, atrás a la derecha) -->
  <rect x="50" y="20" width="50" height="50" rx="8" fill="#A0D8E8" opacity="0.7"/>

  <!-- Cuadrado 2 (medio, centro) -->
  <rect x="35" y="35" width="50" height="50" rx="8" fill="#52C3DD" opacity="0.8"/>

  <!-- Cuadrado 3 (más oscuro, adelante a la izquierda) -->
  <rect x="20" y="50" width="50" height="50" rx="8" fill="#00A9CE"/>

  <!-- Marca blanca en el cuadrado frontal (opcional, para profundidad) -->
  <rect x="28" y="58" width="34" height="34" rx="6" fill="white" opacity="0.15"/>
</svg>
