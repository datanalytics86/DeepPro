<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Fondo -->
  <rect width="800" height="500" fill="#F5F5F5"/>

  <!-- Header -->
  <rect x="20" y="20" width="760" height="60" fill="#FFFFFF" rx="8"/>
  <rect x="20" y="20" width="250" height="60" fill="#4169E1" rx="8"/>
  <text x="145" y="52" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    Monto en UF
  </text>
  <text x="145" y="72" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    560.072
  </text>

  <!-- Sección de filtros laterales -->
  <rect x="20" y="100" width="200" height="380" fill="#FFFFFF" rx="8"/>
  <text x="30" y="125" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    Responsables
  </text>
  <rect x="30" y="135" width="170" height="25" fill="#F0F0F0" rx="4"/>
  <rect x="30" y="165" width="170" height="25" fill="#F0F0F0" rx="4"/>
  <text x="30" y="225" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    Status
  </text>
  <rect x="30" y="235" width="170" height="25" fill="#F0F0F0" rx="4"/>

  <!-- Gráfico de barras horizontales (Montos por Site) -->
  <rect x="240" y="100" width="540" height="180" fill="#FFFFFF" rx="8"/>
  <text x="250" y="125" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">
    Montos en UF por Site
  </text>
  <!-- Barras horizontales azules -->
  <rect x="260" y="145" width="420" height="20" fill="#4169E1" rx="3"/>
  <text x="690" y="160" font-family="Arial, sans-serif" font-size="12" fill="#333">222.315</text>

  <rect x="260" y="175" width="330" height="20" fill="#4169E1" rx="3"/>
  <text x="600" y="190" font-family="Arial, sans-serif" font-size="12" fill="#333">129.418</text>

  <rect x="260" y="205" width="310" height="20" fill="#4169E1" rx="3"/>
  <text x="580" y="220" font-family="Arial, sans-serif" font-size="12" fill="#333">126.958</text>

  <rect x="260" y="235" width="190" height="20" fill="#4169E1" rx="3"/>
  <text x="460" y="250" font-family="Arial, sans-serif" font-size="12" fill="#333">82.197</text>

  <!-- Gráfico de flujos (barras apiladas) -->
  <rect x="240" y="300" width="540" height="180" fill="#FFFFFF" rx="8"/>
  <text x="250" y="325" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">
    Flujos en UF, por MES y Site
  </text>

  <!-- Barras apiladas de colores (simulando flujo temporal) -->
  <g>
    <!-- Mayo 2023 -->
    <rect x="280" y="350" width="30" height="80" fill="#FFD700" rx="2"/>
    <rect x="280" y="350" width="30" height="40" fill="#FF6347" rx="2"/>
    <rect x="280" y="350" width="30" height="20" fill="#4169E1" rx="2"/>

    <!-- Junio 2023 -->
    <rect x="320" y="340" width="30" height="90" fill="#FFD700" rx="2"/>
    <rect x="320" y="340" width="30" height="50" fill="#FF6347" rx="2"/>
    <rect x="320" y="340" width="30" height="25" fill="#4169E1" rx="2"/>

    <!-- Más barras... -->
    <rect x="360" y="345" width="30" height="85" fill="#FFD700" rx="2"/>
    <rect x="400" y="355" width="30" height="75" fill="#FFD700" rx="2"/>
    <rect x="440" y="350" width="30" height="80" fill="#FFD700" rx="2"/>
    <rect x="480" y="345" width="30" height="85" fill="#FFD700" rx="2"/>
    <rect x="520" y="350" width="30" height="80" fill="#FFD700" rx="2"/>
    <rect x="560" y="360" width="30" height="70" fill="#FFD700" rx="2"/>

    <!-- Eje X labels -->
    <text x="295" y="450" font-family="Arial, sans-serif" font-size="9" fill="#666">may 2023</text>
    <text x="415" y="450" font-family="Arial, sans-serif" font-size="9" fill="#666">jul</text>
    <text x="535" y="450" font-family="Arial, sans-serif" font-size="9" fill="#666">sept</text>
  </g>
</svg>
