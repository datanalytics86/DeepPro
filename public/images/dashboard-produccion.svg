<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Fondo -->
  <rect width="800" height="500" fill="#1A1D29"/>

  <!-- Header del dashboard -->
  <rect x="20" y="20" width="760" height="60" fill="#252835" rx="8"/>
  <text x="40" y="55" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">
    Total Producción por Año y Mes
  </text>

  <!-- Filtros -->
  <rect x="600" y="35" width="160" height="30" fill="#1A1D29" rx="4"/>
  <text x="615" y="56" font-family="Arial, sans-serif" font-size="14" fill="#A0A0A0">
    PRODUCTO ▼
  </text>

  <!-- Gráfico de barras -->
  <g>
    <!-- Eje Y -->
    <line x1="60" y1="120" x2="60" y2="380" stroke="#404040" stroke-width="2"/>
    <!-- Eje X -->
    <line x1="60" y1="380" x2="740" y2="380" stroke="#404040" stroke-width="2"/>

    <!-- Barras de producción (azules/púrpuras) -->
    <rect x="90" y="200" width="40" height="180" fill="#4169E1" rx="4"/>
    <rect x="150" y="180" width="40" height="200" fill="#6A5ACD" rx="4"/>
    <rect x="210" y="160" width="40" height="220" fill="#4169E1" rx="4"/>
    <rect x="270" y="190" width="40" height="190" fill="#6A5ACD" rx="4"/>
    <rect x="330" y="170" width="40" height="210" fill="#4169E1" rx="4"/>
    <rect x="390" y="185" width="40" height="195" fill="#6A5ACD" rx="4"/>
    <rect x="450" y="175" width="40" height="205" fill="#4169E1" rx="4"/>
    <rect x="510" y="195" width="40" height="185" fill="#6A5ACD" rx="4"/>
    <rect x="570" y="180" width="40" height="200" fill="#4169E1" rx="4"/>
    <rect x="630" y="185" width="40" height="195" fill="#6A5ACD" rx="4"/>
    <rect x="690" y="190" width="40" height="190" fill="#4169E1" rx="4"/>

    <!-- Valores sobre las barras -->
    <text x="110" y="190" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">13,108</text>
    <text x="170" y="170" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">11,951</text>
    <text x="230" y="150" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">12,372</text>

    <!-- Labels de meses -->
    <text x="110" y="400" font-family="Arial, sans-serif" font-size="10" fill="#A0A0A0" text-anchor="middle">enero</text>
    <text x="170" y="400" font-family="Arial, sans-serif" font-size="10" fill="#A0A0A0" text-anchor="middle">feb</text>
    <text x="230" y="400" font-family="Arial, sans-serif" font-size="10" fill="#A0A0A0" text-anchor="middle">marzo</text>
    <text x="290" y="400" font-family="Arial, sans-serif" font-size="10" fill="#A0A0A0" text-anchor="middle">abril</text>
    <text x="350" y="400" font-family="Arial, sans-serif" font-size="10" fill="#A0A0A0" text-anchor="middle">mayo</text>
    <text x="410" y="400" font-family="Arial, sans-serif" font-size="10" fill="#A0A0A0" text-anchor="middle">junio</text>
    <text x="470" y="400" font-family="Arial, sans-serif" font-size="10" fill="#A0A0A0" text-anchor="middle">julio</text>
    <text x="530" y="400" font-family="Arial, sans-serif" font-size="10" fill="#A0A0A0" text-anchor="middle">agosto</text>
  </g>

  <!-- Gráfico de línea (% Ocupación) -->
  <g opacity="0.3">
    <polyline points="90,300 150,280 210,260 270,270 330,265 390,275 450,270 510,280 570,275 630,278 690,280"
              fill="none" stroke="#00D9FF" stroke-width="3"/>
    <text x="400" y="450" font-family="Arial, sans-serif" font-size="12" fill="#00D9FF" text-anchor="middle">
      % Ocupación
    </text>
  </g>

  <!-- Panel lateral con treemap -->
  <rect x="20" y="100" width="180" height="280" fill="#252835" rx="8"/>
  <text x="30" y="125" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">
    Total por PRODUCTO
  </text>
  <!-- Cuadrados de treemap -->
  <rect x="30" y="140" width="160" height="50" fill="#4169E1" rx="4"/>
  <rect x="30" y="195" width="75" height="80" fill="#FF8C42" rx="4"/>
  <rect x="110" y="195" width="80" height="80" fill="#8B008B" rx="4"/>
  <rect x="30" y="280" width="60" height="90" fill="#DC143C" rx="4"/>
  <rect x="95" y="280" width="95" height="45" fill="#00CED1" rx="4"/>
  <rect x="95" y="330" width="95" height="40" fill="#FF69B4" rx="4"/>
</svg>
