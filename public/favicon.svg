<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fondo con gradiente -->
  <rect width="100" height="100" rx="20" fill="#FFFFFF"/>

  <!-- Cuadrado 1 (más claro, atrás a la derecha) -->
  <rect x="38" y="15" width="42" height="42" rx="6" fill="#A0D8E8" opacity="0.7"/>

  <!-- Cuadrado 2 (medio, centro) -->
  <rect x="28" y="25" width="42" height="42" rx="6" fill="#52C3DD" opacity="0.8"/>

  <!-- Cuadrado 3 (más oscuro, adelante a la izquierda) -->
  <rect x="18" y="35" width="42" height="42" rx="6" fill="#00A9CE"/>

  <!-- Detalle blanco para profundidad -->
  <rect x="24" y="41" width="30" height="30" rx="5" fill="white" opacity="0.15"/>
</svg>
